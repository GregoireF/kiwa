# zizmor's findings accepted on purpose, each on one line of one file. Everything else fails CI.
#
# release.yml is generated by dist (`cargo xtask dist-generate`) and rewritten on each upgrade, so
# it is not edited by hand; its findings are reviewed here instead.
rules:
  excessive-permissions:
    ignore:
      # The release job creates the GitHub release and uploads its assets; dist sets this at the
      # workflow level and every job runs only on version tags or as a plan on pull requests.
      - release.yml:18
  template-injection:
    ignore:
      # Expands `github.ref_name`, a version tag pushed by a maintainer, or the literal `plan`.
      - release.yml:80
  unpinned-images:
    ignore:
      # dist's build matrix sets no container for kiwa's targets: the expression yields null.
      - release.yml:111
