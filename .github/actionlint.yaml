# actionlint's findings accepted on purpose. release.yml is generated by dist
# (`cargo xtask dist-generate`) and rewritten on each upgrade, so it is not edited by hand.
paths:
  .github/workflows/release.yml:
    ignore:
      # `$RUNNER_TEMP` and `$PRERELEASE_FLAG` in dist's release step: the flag must split into
      # zero or one word, and the runner's temporary folder has no spaces.
      - 'SC2086'
      # Style only: dist appends to $GITHUB_OUTPUT one line at a time.
      - 'SC2129'
      # `uses: $/.github/workflows/publish-tap.yml`: GitHub's self-repository syntax, which dist
      # writes and zizmor asks for. actionlint 1.7.12 does not know it yet; GitHub accepts it
      # (measured: the release workflow starts and plans on pull requests with it).
      - 'reusable workflow call "\$/'
