# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Called by the dist release workflow (dist-workspace.toml: publish-jobs = ["./publish-crates"])
# with the release plan, after the GitHub release is up. Publishes kiwa-core, then kiwa, to
# crates.io (`cargo install kiwa`). The token is the environment secret CARGO_REGISTRY_TOKEN of
# the `release` environment, read here and passed to nothing else. Pre-releases are not
# published (dist skips publish jobs for them). A version already on crates.io is skipped, so a
# release can be re-run.
name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

jobs:
  crates:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read # check out the tagged sources
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: read the plan
        id: meta
        run: |
          set -euo pipefail
          tag="$(jq -r '.announcement_tag' <<<"$PLAN")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false

      - name: install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: publish kiwa-core and kiwa
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for crate in kiwa-core kiwa; do
            if curl -fsS -A "kiwa-release (github.com/GregoireF/kiwa)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null 2>&1; then
              echo "$crate $VERSION is already on crates.io"
              continue
            fi
            # --locked: the Cargo.lock of the tag, as the release binaries were built.
            cargo publish --locked -p "$crate"
          done
