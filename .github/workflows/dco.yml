#
# Every commit of a pull request carries a Developer Certificate of Origin sign-off
# (`git commit -s`), checked with ship-it's parser (CONTRIBUTING.md).
name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: signoff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: install ship
        run: go install github.com/GregoireF/ship-it/cmd/ship@v0.1.0 # pin: ship
      - name: check signoff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ship check signoff --from "$BASE" --to "$HEAD"
