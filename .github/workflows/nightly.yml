# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Every night, the full suite and the real package-manager tests on the three operating
# systems, with the tools the runner images ship that day. kiwa's runner rules are measured
# (docs/explanation/args-forwarding.md); this catches the day a new npm, Bun or runner image
# changes how hooks or arguments behave, instead of a user finding out. A failure opens
# (or comments on) one issue, from a job that runs no repository code.
name: nightly

on:
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: corepack enable
      - name: tests, real package managers included
        env:
          KIWA_REQUIRE_RUNNERS: "1"
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: cargo test --workspace
      - name: tool versions
        if: always()
        run: |
          node --version; npm --version; bun --version
          cargo --version

  report:
    name: open an issue on failure
    needs: suite
    if: always() && needs.suite.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the nightly issue
    steps:
      - name: open or comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly suite failed"
          body="The nightly run failed: $RUN_URL"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
