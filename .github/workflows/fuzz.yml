# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Weekly fuzzing of the manifest parsers (fuzz/README.md): each target runs 10 minutes in
# its own job. A failing target uploads its crashing inputs as fuzz-<target>, and one issue
# per failing target is opened (or commented on) by a job that runs no repository code.
name: fuzz

on:
  schedule:
    - cron: "11 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz each target, in seconds
        default: "600"

permissions: {}

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [make, just, taskfile, rake, config]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust nightly
        # rustup comes with every GitHub runner: no third-party action.
        run: rustup toolchain install nightly --profile minimal && rustup default nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - name: fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || '600' }}
        run: cargo +nightly fuzz run "$TARGET" -- -max_total_time="$SECONDS_EACH"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30

  issues:
    name: open issues
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # open or comment on one issue per failing target
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-*
          path: ${{ runner.temp }}/reports
      - name: open or comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in "$RUNNER_TEMP"/reports/fuzz-*/; do
            target="$(basename "$dir")"
            title="Fuzzing found a crash: ${target#fuzz-}"
            body="Crashing inputs are attached to $RUN_URL (artifact $target). Reproduce with \`cargo +nightly fuzz run ${target#fuzz-} <input>\`."
            number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done
