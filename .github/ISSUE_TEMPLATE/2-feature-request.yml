# SPDX-License-Identifier: MIT OR Apache-2.0
name: Feature request
description: Something kiwa should do.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where kiwa got in the way. Start from the need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
