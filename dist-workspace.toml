# Release configuration for dist (https://github.com/axodotdev/cargo-dist).
# Keys from the official reference: book/src/reference/config.md.
# After editing, regenerate the release workflow with: dist generate

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
# Shell (macOS/Linux) and PowerShell (Windows) one-line installers.
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-pc-windows-msvc",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
# Build provenance (verify with `gh attestation verify`) and a CycloneDX SBOM per release:
# supply-chain evidence expected by the EU Cyber Resilience Act.
github-attestations = true
cargo-cyclonedx = true
# Homebrew formula + Scoop manifest pushed to GregoireF/homebrew-tap (custom job).
publish-jobs = ["./publish-tap"]
# Check the release plan on every pull request.
pr-run-mode = "plan"
# dist 0.34 renders local publish jobs as `uses: $/.github/...`; `cargo xtask dist-generate`
# rewrites it to the `./.github/...` form GitHub requires, so the file differs from dist's output.
allow-dirty = ["ci"]

# Actions pinned by commit, like every other workflow (zizmor: unpinned-uses).
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
