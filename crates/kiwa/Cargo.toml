[package]
name = "kiwa"
description = "Find any project. Run any task. Built for humans and AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
# Two binaries (kiwa, kw); `cargo run -p kiwa` runs the main one.
default-run = "kiwa"

# The program lives in the library; `kiwa` and `kw` are two names for it (ROADMAP K-77).
[lib]
name = "kiwa_cli"
path = "src/lib.rs"
# Internal library: its doc comments hold screen sketches, not examples.
doctest = false

[[bin]]
name = "kiwa"
path = "src/main.rs"

[[bin]]
name = "kw"
path = "src/bin/kw.rs"

[dependencies]
kiwa-core.workspace = true
anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_complete_nushell.workspace = true
kdl.workspace = true
ctrlc.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
which.workspace = true

# No child left behind (exec.rs, mod guard): signals forwarded on Unix, job object on Windows.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
nix = { version = "0.29", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
